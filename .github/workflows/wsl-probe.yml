name: WSL Probe

# Throwaway experiment: see what wsl.exe prints with and without a distro.
on:
  push:
    branches: ['*/wip/wsl-*']

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe (runner as-is)
        shell: pwsh
        run: ./scripts/wsl-probe.ps1

      - name: Install WSL + Ubuntu distro
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04

      - name: Probe (after installing a distro)
        shell: pwsh
        run: ./scripts/wsl-probe.ps1
